<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="True Grit">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2429">
<title>True Grit Options — Job Builder</title>
<style>
:root{
  --charcoal:#1f2429;--charcoal2:#2b3138;--steel:#3d4752;--red:#c8382e;--red-dk:#a12b23;
  --bg:#eef1f4;--panel:#fff;--line:#d9dee4;--ink:#1f2429;--mute:#697585;--good:#2e7d5b;--gold:#c8952a;
  --shadow:0 1px 3px rgba(20,28,38,.08),0 8px 24px rgba(20,28,38,.08);
  --shadow-lg:0 12px 40px rgba(20,28,38,.18);--r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}
h1,h2,h3,h4{margin:0;line-height:1.2}
.mono{font-variant-numeric:tabular-nums}

.topbar{background:var(--charcoal);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.3px}
.brand .mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(150deg,var(--red),var(--red-dk));display:grid;place-items:center;font-weight:900;font-size:17px;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);flex:none}
.brand .bt{font-size:16px;line-height:1.05}
.brand .bt small{display:block;font-size:9.5px;font-weight:600;color:#9fb0c0;letter-spacing:1.5px}
.topnav{display:flex;gap:4px;margin-left:auto;background:rgba(255,255,255,.06);padding:4px;border-radius:11px}
.topnav button{color:#c3cdd8;padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;transition:.15s}
.topnav button.active{background:#fff;color:var(--charcoal)}
.topnav button:not(.active):hover{color:#fff}
.company-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;color:#dfe6ec}
.company-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}

.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 70px}
.page-head{margin-bottom:20px}
.page-head h2{font-size:23px;font-weight:800}
.page-head p{margin:5px 0 0;color:var(--mute);font-size:14.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.section-title{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);margin:0 0 12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:11px;font-weight:800;font-size:15px;transition:.15s;background:var(--steel);color:#fff}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn-red{background:linear-gradient(160deg,var(--red),var(--red-dk))}
.btn-dark{background:var(--charcoal)}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--steel)}
.btn-sm{padding:8px 14px;font-size:13.5px;border-radius:9px}
.btn-lg{padding:15px 26px;font-size:16.5px}
.btn-block{width:100%}

.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:6px;letter-spacing:.2px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcfd;color:var(--ink);transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--red);background:#fff}
.field .hint{font-size:11.5px;color:var(--mute);margin-top:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.inline-affix{position:relative}
.inline-affix .pre{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);font-weight:700}
.inline-affix.pre-pad input{padding-left:26px}
.inline-affix .suf{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mute);font-weight:700}

/* Job Builder */
.jb-input{width:100%;min-height:104px;padding:15px 16px;font-size:17px;border:1.5px solid var(--line);border-radius:14px;background:#fff;line-height:1.6;resize:vertical}
.jb-input:focus{outline:none;border-color:var(--red)}
.jb-hintrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.ex-chip{padding:7px 13px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-size:13px;color:var(--mute);font-weight:600}
.ex-chip:hover{border-color:var(--red);color:var(--ink)}
.aibadge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--red);background:#fdeceb;padding:4px 10px;border-radius:20px}

.worksheet{margin:22px 0 8px}
.ws-row{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.ws-row.unmatched{border-color:#e6b800;background:#fffdf3}
.ws-ico{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.ws-main{flex:1;min-width:0}
.ws-issue{font-weight:700;font-size:15px}
.ws-match{font-size:12.5px;color:var(--mute)}
.ws-x{color:var(--mute);font-size:20px;padding:4px 8px;border-radius:8px}
.ws-x:hover{background:#f0f2f5}

.options{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));align-items:stretch;margin-top:18px}
.options.stacked{grid-template-columns:1fr;gap:14px;max-width:840px;margin-left:auto;margin-right:auto}
.options.stacked .opt{flex-direction:row}
.options.stacked .opt.featured{transform:none;box-shadow:var(--shadow-lg)}
.options.stacked .opt .hero{width:250px;flex:none;display:flex;flex-direction:column;justify-content:center}
.options.stacked .opt.featured .tier-name{padding-right:0}
/* stacked: the badge floats over the LINES panel, so drop the first line clear of it
   (padding the whole body keeps every line price right-aligned with each other) */
.options.stacked .opt.featured .opt-body{padding-top:46px}
.options.stacked .opt .opt-body{flex:1}
.options.stacked .opt{zoom:var(--f,1)}
.seg{padding:7px 13px;border-radius:8px;font-size:13px;font-weight:700;color:var(--mute);background:none}
.seg.on{background:var(--charcoal);color:#fff}
@media(max-width:640px){ .options.stacked .opt{flex-direction:column} .options.stacked .opt .hero{width:auto} }
.opt{position:relative;border:2px solid transparent;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:.18s;box-shadow:var(--shadow)}
.opt:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.opt .hero{padding:20px 18px 18px;color:#fff}
.opt .tier-name{font-size:20px;font-weight:900;letter-spacing:.2px}
.opt .tier-tag{font-size:12.5px;font-weight:700;opacity:.9;margin-top:2px}
.opt .price{font-size:34px;font-weight:900;margin:13px 0 1px;letter-spacing:-.5px}
.opt .price-sub{font-size:11.5px;opacity:.88}
.opt .opt-body{background:#fff;padding:16px 16px 18px;display:flex;flex-direction:column;flex:1}
.opt .lines{list-style:none;margin:0 0 15px;padding:0;display:flex;flex-direction:column;gap:13px;flex:1}
.opt .li{font-size:12.5px;line-height:1.35}
.opt .li .lt{display:flex;justify-content:space-between;gap:8px}
.opt .li .lname{font-weight:800;font-size:13px}
.opt .li .lprice{color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:800}
.opt .li .ldesc{color:var(--mute);font-size:11.5px;margin-top:2px;line-height:1.35}
.opt .li .lact{display:flex;gap:14px;margin-top:4px}
.opt .li .lswap{font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.opt .li .lswap:hover{text-decoration:underline}
.editflag{font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#2e7d5b;background:#e9f6ef;padding:2px 6px;border-radius:5px;vertical-align:middle}
.opt.featured .tier-name{padding-right:104px}
.opt.featured{transform:scale(1.025)}
.opt.featured:hover{transform:scale(1.025) translateY(-4px)}
.badge{position:absolute;top:14px;right:14px;background:#fff;color:var(--red);font-size:10px;font-weight:900;letter-spacing:.6px;padding:5px 10px;border-radius:20px;text-transform:uppercase;box-shadow:0 3px 8px rgba(0,0,0,.22)}

.job-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.job-card{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:15px;text-align:left;transition:.15s;display:flex;flex-direction:column;gap:4px}
.job-card:hover{border-color:var(--red);box-shadow:var(--shadow);transform:translateY(-2px)}
.job-card .jc-cat{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--red)}
.job-card .jc-name{font-size:15.5px;font-weight:800}
.job-card .jc-meta{font-size:12px;color:var(--mute);margin-top:auto}

.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);padding:10px 12px;border-bottom:2px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tr:hover td{background:#f7f9fb}
.pillcat{display:inline-block;padding:3px 9px;border-radius:6px;background:#eef1f4;font-size:11.5px;font-weight:700;color:var(--steel)}
.mini{font-size:12px;color:var(--mute)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 17px}
.stat .sv{font-size:25px;font-weight:900}
.stat .sl{font-size:12px;color:var(--mute);font-weight:600;margin-top:2px}

.modal-bg{position:fixed;inset:0;background:rgba(20,28,38,.55);backdrop-filter:blur(2px);z-index:100;display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-head{display:flex;align-items:center;padding:17px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.modal-head h3{font-size:18px;font-weight:800}
.modal-head .x{margin-left:auto;font-size:22px;color:var(--mute);padding:4px 8px;border-radius:8px}
.modal-head .x:hover{background:#f0f2f5}
.modal-body{padding:22px}
.pick-item{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:.12s}
.pick-item:hover{border-color:var(--red);background:#fdf7f6}
.pick-item.sel{border-color:var(--good);background:#f0f9f4}
.pick-item .pn{font-weight:700;font-size:14px}
.pick-item .pp{font-weight:800;white-space:nowrap}

.receipt{max-width:540px;margin:0 auto}
.receipt .r-hero{border-radius:16px 16px 0 0;padding:24px;color:#fff;text-align:center}
.receipt .r-hero .rt{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.85}
.receipt .r-hero .rn{font-size:25px;font-weight:900;margin-top:4px}
.receipt .r-hero .rp{font-size:38px;font-weight:900;margin-top:8px}
.receipt .r-body{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 16px 16px;padding:22px 24px}
.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.line.total{border-bottom:none;font-weight:900;font-size:18px;padding-top:13px}

.gate{min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 500px at 50% -10%,#2b3138,#1a1e23)}
.gate .box{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:380px;box-shadow:var(--shadow-lg);text-align:center}
.gate .mark{width:60px;height:60px;border-radius:14px;background:linear-gradient(150deg,var(--red),var(--red-dk));display:grid;place-items:center;font-weight:900;font-size:26px;color:#fff;margin:0 auto 16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--charcoal);color:#fff;padding:13px 22px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow-lg);z-index:200;transition:.3s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.empty{text-align:center;padding:44px 20px;color:var(--mute)}
.callout{background:#fdf7f6;border:1.5px solid #f3d3d0;border-radius:12px;padding:13px 15px;font-size:13.5px;color:#7a2e28}

@media(max-width:720px){
  .row2,.row3{grid-template-columns:1fr}
  .topnav button span{display:none}
  .company-pill span.cp-label{display:none}
  .brand .bt small{display:none}
  .wrap{padding:16px 13px 60px}
}

/* ===== PRINT / SAVE-AS-PDF =====
   Prints ONLY the signed receipt as a clean one-page document (no app chrome, no buttons),
   so "Save as PDF" produces a file that can be attached to an invoice. */
@media print{
  @page{ margin:14mm; }
  html,body{ background:#fff !important; }
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  .topbar, #gate, #modalRoot, #toast, .no-print{ display:none !important; }
  #app.hidden{ display:block !important; }
  .wrap{ padding:0 !important; max-width:none !important; }
  .receipt{ max-width:none !important; margin:0 !important; }
  .receipt .r-hero{ border-radius:0 !important; padding:20px !important; }
  .receipt .r-body{ border:none !important; border-radius:0 !important; padding:16px 0 0 !important; }
  .receipt .line{ break-inside:avoid; page-break-inside:avoid; }
  .receipt .r-hero, .receipt .r-body{ box-shadow:none !important; }
  a[href]:after{ content:'' !important; }

  /* --- options proposal: always print as one option per row, whatever the on-screen toggle --- */
  .print-only{ display:block !important; }
  .options{ display:block !important; max-width:none !important; margin:0 !important; }
  .opt{ display:flex !important; flex-direction:row !important; zoom:1 !important; transform:none !important;
        margin:0 0 11px !important; box-shadow:none !important;
        break-inside:avoid !important; page-break-inside:avoid !important; }
  .opt:hover{ transform:none !important; }
  .opt .hero{ width:33% !important; flex:none !important; display:flex !important;
              flex-direction:column !important; justify-content:center !important; padding:16px !important; }
  .opt .opt-body{ flex:1 !important; padding:14px 16px !important; }
  .opt .lines{ margin-bottom:0 !important; gap:10px !important; }
  .opt .opt-body>.btn{ display:none !important; }        /* "Choose X" is meaningless on paper */
  .opt.featured .opt-body{ padding-top:44px !important; } /* keep badge clear of the first price */
  .opt .price{ font-size:28px !important; margin:8px 0 1px !important; }
}
/* customer-facing header that appears ONLY in the exported options PDF */
.print-only{ display:none; }
.proposal-head{ text-align:center; margin:0 0 16px; }
.proposal-head .ph-logo{ height:40px; max-width:190px; object-fit:contain; display:block; margin:0 auto 8px; }
.proposal-head .ph-co{ font-size:15px; font-weight:900; letter-spacing:.4px; text-transform:uppercase; color:var(--ink); }
.proposal-head .ph-t{ font-size:25px; font-weight:900; margin-top:2px; }
.proposal-head .ph-d{ font-size:11.5px; color:var(--mute); margin-top:3px; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div id="gate" class="gate">
  <div class="box">
    <div class="mark">TG</div>
    <h2 style="font-size:21px">True Grit Options</h2>
    <p style="color:var(--mute);font-size:13.5px;margin:6px 0 20px">On-the-fly options for the field</p>
    <div class="field" style="text-align:left">
      <label>Email</label>
      <input id="gateEmail" type="email" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="you@shop.com">
    </div>
    <div class="field" style="text-align:left">
      <label>Password</label>
      <input id="gatePass" type="password" autocomplete="current-password" placeholder="Your password" onkeydown="if(event.key==='Enter')tryLogin()">
    </div>
    <button class="btn btn-red btn-lg btn-block" id="gateBtn" onclick="tryLogin()">Sign in</button>
    <div class="hint" id="gateMsg" style="margin-top:10px;min-height:16px"></div>
    <div style="margin-top:8px"><button type="button" onclick="toggleGateMode()" style="background:none;border:none;color:var(--red);font-weight:700;cursor:pointer;font-size:13px;text-decoration:underline;padding:0">New here? Create your account</button></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand"><div class="mark" id="brandMark">TG</div><div class="bt" id="brandName">True Grit Options<small>JOB BUILDER</small></div></div>
    <div class="topnav" id="topnav"></div>
    <div class="company-pill" id="companyPill"><span class="dot"></span><span id="companyName">—</span></div>
  </div>
  <div class="wrap" id="view"></div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>

const STARTER = [

["disposal","Evolution Septic Assist Disposal",1301.58,820.26],

function authed(){ return !!(ME && ME.uid); }
async function sbPullRows(){ if(!authed()) return null;
  try{ const {data,error}=await sb.from('tenants').select('id,name,slug,settings,tiers,book,status').order('name'); if(error) return null; return data; }catch(e){ return null; } }
async function sbUpsert(c){ if(!authed()) return;
  try{ await sb.from('tenants').update({name:c.name,settings:c.settings,tiers:c.tiers,book:c.book}).eq('id',c.id); }catch(e){}
}

let __syncT; function scheduleSync(){ if(!authed())return; clearTimeout(__syncT); __syncT=setTimeout(async()=>{ for(const c of (DB.companies||[])) await sbUpsert(c); window.__dirty=false; }, 900); }
async function pullAndApply(){ if(window.__dirty) return 'pending'; const rows=await sbPullRows(); if(rows===null) return 'offline'; if(window.__dirty) return 'pending';
  if(rows.length===0){ return 'empty'; }
  window.__syncing=true;
  DB.companies=rows.map(x=>({id:x.id,name:x.name,settings:x.settings,tiers:x.tiers,book:x.book}));
  const wanted=(ME&&ME.tenantId)?ME.tenantId:DB.activeCompanyId;
  DB.activeCompanyId = DB.companies.find(c=>c.id===wanted) ? wanted : DB.companies[0].id;
  saveState(); window.__syncing=false; return 'pulled';
}
async function startSync(){ if(!authed())return; const res=await pullAndApply(); if(res==='pulled') render();
  if(!window.__syncBound){ window.__syncBound=true;
    window.addEventListener('focus',async()=>{ if(await pullAndApply()==='pulled') render(); });

  }
}

/* markup for a given material cost using sliding scale */
function markupPctForCost(cost, s){
  if(!s.useSliding) return s.flatMarkup;
  for(const t of s.markupTiers){ if(t.to==null||cost<=t.to) return t.pct; }
  return s.markupTiers[s.markupTiers.length-1].pct;
}
/* price a CUSTOM task from labor + materials */
function priceCustom(hours, materialCost, s){
  const labor=hours*s.laborRate;
  const mat=materialCost*(1+markupPctForCost(materialCost,s)/100);
  return roundTo((labor+mat)*(1+(s.taxPct||0)/100), s.roundTo||1);
}
function taskPrice(t,s){ // imported/locked = fixed price; custom = computed
  if(t.custom && !t.priceLocked) return priceCustom(t.laborHours||0, t.materialCost||0, s);

function monthly(p,m,apr){ m=m||1; const r=(apr||0)/100/12; if(r<=0) return Math.ceil(p/m); return Math.ceil(p*r/(1-Math.pow(1+r,-m))); }

  for(const k in custom) out[k]=Object.assign({}, out[k]||{}, custom[k]);
  const labels=(c&&c.settings&&c.settings.groupLabels)||{};
  for(const k in labels){ if(out[k]) out[k].label=labels[k]; }
  const cats=(c&&c.settings&&c.settings.groupCats)||{};
  for(const k in cats){ if(out[k]) out[k].cat=cats[k]; }
  return out;
}
/* sorted list of every category currently in use across this shop's groups */
function allCategories(){ return Array.from(new Set(Object.values(allGroups()).map(g=>g.cat).filter(Boolean))).sort(); }
/* set a group's category — built-in groups use a settings.groupCats override, custom groups store it directly */
function setGroupCategory(k, cat){
  const c=co(); cat=(cat||'').trim()||'Custom';
  if(isCustomGroup(k)){ c.settings.groups[k]=Object.assign({}, c.settings.groups[k], {cat}); if(c.settings.groupCats) delete c.settings.groupCats[k]; }
  else { if(!c.settings.groupCats) c.settings.groupCats={}; if(GROUPS[k] && cat===GROUPS[k].cat) delete c.settings.groupCats[k]; else c.settings.groupCats[k]=cat; }
}
function grp(k){ return allGroups()[k]; }
function matchGroup(phrase){
  const p=phrase.toLowerCase();
  if(p.includes('tankless')) return 'tankless';   // "tankless water heater" is never a tank
  let best=null,bs=0; const AG=allGroups();
  for(const key in AG){
    let s=0;
    (STRONG[key]||[]).forEach(kw=>{ if(p.includes(kw)) s+=1000; });
    (AG[key].syn||[]).forEach(kw=>{ if(p.includes(kw)) s+=kw.length; });
    if(s>bs){bs=s;best=key;}
  }
  return bs>0?best:null;
}
function groupTasks(key){ return co().book.filter(t=>t.g===key).slice().sort((a,b)=>taskPrice(a,co().settings)-taskPrice(b,co().settings)); }

/* ---- relevance: build tiers only from tasks that fit what the customer actually said ---- */
const JB_STOP=new Set(['the','and','for','with','replace','install','installed','new','fix','repair','repaired','need','needs','needed','under','job','please','also','out','one','two','the','are','its','my','our','get','got','put','off','has','have','that','this','plumbing']);
function jbWords(str){ return (str||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2 && !JB_STOP.has(w)); }
function relevanceScore(name, phrase){ const a=new Set(jbWords(phrase)); let s=0; for(const w of jbWords(name)){ if(a.has(w)) s++; } return s; }
/* Non-standalone line items — add-ons, haul-away/labor lines, and component-only parts.
   These should never anchor a whole-visit option (a toilet job must not lead with a "float rod",
   a faucet job must not lead with a "spray head only"). They still appear if the customer names them. */
const MINOR_RE=/\b(add for|reinstall|unstick|acid flush|float rod|vacuum breaker|floor drain cover|diverter|second man|remove existing|torque arrestor|arrestor|disposal of|burner)\b|\bonly\b|\bcartridge\b|spray (head|hose)|\bslide-bar\b|\bhandshower\b|\bwrench\b/i;
function isMinorLine(name){ return MINOR_RE.test(name||''); }
/* words that just name the group itself (toilet, faucet, drain…) — they don't distinguish tasks within it */
function groupGeneric(groupKey){
  const g=grp(groupKey)||{}; const set=new Set();
  jbWords(g.label||'').forEach(w=>set.add(w));
  (g.syn||[]).forEach(k=>jbWords(k).forEach(w=>set.add(w)));
  (STRONG[groupKey]||[]).forEach(k=>jbWords(k).forEach(w=>set.add(w)));
  return set;
}
/* a stated tank/appliance size ("50 gallon", "50 gal", "50-gal") is a hard requirement, not a hint */
function phraseGallons(phrase){ const out=[]; const re=/(\d{2,3})\s*-?\s*gal/gi; let m; while((m=re.exec((phrase||'').toLowerCase()))) out.push(m[1]); return out; }
function taskMatchesGallons(name, gals){ const n=(name||'').toLowerCase(); return gals.some(g=> new RegExp('\\b'+g+'\\s*-?\\s*gal','i').test(n)); }
/* Candidate tasks for tiering: real, standalone jobs that fit what the customer actually said,
   kept within a sane price band so a small job doesn't ladder up into a huge unrelated one
   (e.g. "replace p-trap" must NOT top out at a 40ft sewer line, and "replace toilet" must NOT
   lead with a float-rod repair part). */
function candidateTasks(groupKey, phrase){
  const s=co().settings;
  let all=groupTasks(groupKey);
  if(all.length<=1) return all;
  // hard size filter: if the customer named a tank size (e.g. "50 gallon"), only offer that size — when the book has it
  const gals=phraseGallons(phrase);
  if(gals.length){ const sized=all.filter(t=>taskMatchesGallons(t.name,gals)); if(sized.length) all=sized; }
  // distinguishing words = what the customer said beyond the group's own name
  const gen=groupGeneric(groupKey);
  const specific=new Set(jbWords(phrase).filter(w=>!gen.has(w)));
  const asked=(name)=>{ for(const w of jbWords(name)){ if(specific.has(w)) return true; } return false; };
  // if they named something specific that matches tasks, narrow to those; otherwise consider the whole group
  let pool = specific.size ? all.filter(t=>asked(t.name)) : [];
  if(pool.length<1) pool=all.slice();
  // drop non-standalone add-on / component lines unless the customer explicitly named them
  const core = pool.filter(t=> !isMinorLine(t.name) || asked(t.name));
  if(core.length>=1) pool=core;
  pool.sort((a,b)=>taskPrice(a,s)-taskPrice(b,s));
  const cap = s.spreadCap || 4;               // top option stays within cap× the cheapest real one
  const base = taskPrice(pool[0],s) || 1;
  let banded = pool.filter(t=> taskPrice(t,s) <= base*cap );
  if(!banded.length) banded=[pool[0]];
  // if the band is thinner than the number of options, widen it so tiers don't duplicate
  const need = s.numOptions || 3;
  if(banded.length < need) banded = pool.slice(0, Math.max(need, banded.length));
  return banded;
}

function analyze(){
  const phrases=parseIssues(jb.text);
  jb.issues=phrases.map(ph=>{ const g=matchGroup(ph); return {phrase:ph, group:g, custom:null}; });
}
/* choose N distinct, increasing task indices spread across a sorted group of M */
function pickIndices(M,N){
  if(M<=0) return [];
  if(N>=M){ const a=[]; for(let i=0;i<N;i++) a.push(Math.min(i,M-1)); return a; }
  const a=[]; let prev=-1;
  for(let i=0;i<N;i++){ let idx=Math.round(i*(M-1)/(N-1)); if(idx<=prev) idx=prev+1; if(idx>M-1) idx=M-1; a.push(idx); prev=idx; }
  return a;
}
function buildOptions(){
  const c=co(), s=c.settings, N=Math.max(1, parseInt(s.numOptions)||3);
  ensureTiers(c,N);
  const matched=jb.issues.filter(i=>i.group||i.custom);
  if(!matched.length){ jb.options=null; jb.buildSkipped=[]; return; }
  const perIssue=[]; const skipped=[];
  matched.forEach(iss=>{
    if(iss.custom){ perIssue.push({iss, custom:true}); return; }
    const tasks=candidateTasks(iss.group, iss.phrase);
    // A matched group with NO priced tasks in the book (e.g. a group just added, renamed, or deleted)
    // can't anchor an option — skip it and report it, rather than crashing the whole build.
    if(!tasks||!tasks.length){ skipped.push(iss.phrase); return; }
    perIssue.push({iss, tasks, idxs:pickIndices(tasks.length,N), group:iss.group});
  });
  jb.buildSkipped=skipped;
  if(!perIssue.length){ jb.options=null; return; }
  jb.options=c.tiers.slice(0,N).map((tier,ti)=>{
    const lines=perIssue.map(pi=>{
      if(pi.custom) return {issue:pi.iss, taskId:pi.iss.custom.id, groupKey:null};
      const idx=pi.idxs[ti];
      const t=pi.tasks[idx]||pi.tasks[pi.tasks.length-1]||pi.tasks[0];
      return t?{issue:pi.iss, taskId:t.id, groupKey:pi.group}:null;
    }).filter(Boolean);
    return {tier, lines};
  });
  applyAddOns();
  jb.options.forEach(o=>{ o.baseTotal=optionTotal(o); }); // reference ladder for spacing (add-on discount applied)
}

async function aiCall(system,user,maxTokens){

async function aiParse(text){

}

function effLine(l){ const s=co().settings; const t=taskById(l.taskId); const base=(t?taskPrice(t,s):0)*(l.disc==null?1:l.disc); return base+(l.adj||0); }
function optionTotal(opt){ const s=co().settings; return roundTo(opt.lines.reduce((a,l)=>a+effLine(l),0), s.roundTo||1); }
/* Multi-item pricing: the highest-cost task in each option is the "main" job at full price; every
   cheaper task becomes an add-on at a discount (tech is already onsite). Silent — no customer wording. */
function applyAddOns(){
  if(!jb.options) return; const s=co().settings; const pct=(s.addOnPct!=null?s.addOnPct:25); const f=1-(pct/100);
  jb.options.forEach(o=>{
    if(!o.lines||!o.lines.length) return;
    if(o.lines.length<=1||pct<=0){ o.lines.forEach(l=>{l.disc=1;l.addon=false;}); return; }
    let mainIdx=0,best=-Infinity;
    o.lines.forEach((l,li)=>{ const t=taskById(l.taskId); const bp=t?taskPrice(t,s):0; if(bp>best){best=bp;mainIdx=li;} });
    o.lines.forEach((l,li)=>{ if(li===mainIdx){l.disc=1;l.addon=false;} else {l.disc=f;l.addon=true;} });

}
/* Keep the tier ladder strictly ascending — WITHOUT ever inflating a real line's price
   for cosmetic spacing. A tier is only stepped up if it would otherwise land at or below the
   tier beneath it (a genuine order break); in every normal case the real prices show as-is. */
function enforceTierOrder(){
  if(!jb.options) return; const s=co().settings; const N=jb.options.length;
  jb.options.forEach(o=>{o.lines.forEach(l=>{l.adj=0;l.adjusted=false;}); o.outOfOrder=false;});
  applyAddOns();
  const step=s.roundTo||1;
  for(let i=1;i<N;i++){
    const below=optionTotal(jb.options[i-1]);
    const actual=optionTotal(jb.options[i]);
    if(actual <= below){                         // act ONLY on a real order break, never for spacing
      if(s.enforceOrder!==false){
        const delta=(below+step)-actual;
        const lines=jb.options[i].lines; let idx=0,best=-1;
        lines.forEach((l,li)=>{const p=effLine(l); if(p>best){best=p;idx=li;}});
        lines[idx].adj=(lines[idx].adj||0)+delta; lines[idx].adjusted=true;
      } else jb.options[i].outOfOrder=true;
    }
  }
}

  const n=parseInt(fp); if(isNaN(n)) return Math.floor((N-1)/2);

/* ---- customer signature / approval on the receipt (touch + mouse) ---- */
let __sig={drawing:false,lx:0,ly:0,dirty:false};
function resetSig(){ __sig={drawing:false,lx:0,ly:0,dirty:false}; }
function sigPos(cv,e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height)}; }
function sigStart(e){ const cv=document.getElementById('sigPad'); if(!cv)return; __sig.drawing=true; const p=sigPos(cv,e); __sig.lx=p.x; __sig.ly=p.y; e.preventDefault(); }
function sigMove(e){ if(!__sig.drawing)return; const cv=document.getElementById('sigPad'); if(!cv)return; const ctx=cv.getContext('2d'); const p=sigPos(cv,e); ctx.strokeStyle='#1f2429'; ctx.lineWidth=2.4; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(__sig.lx,__sig.ly); ctx.lineTo(p.x,p.y); ctx.stroke(); __sig.lx=p.x; __sig.ly=p.y; __sig.dirty=true; e.preventDefault(); }
function sigEnd(){ __sig.drawing=false; }
function sigClear(){ const cv=document.getElementById('sigPad'); if(cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height); __sig.dirty=false; }
function approveOption(){
  const cv=document.getElementById('sigPad'); const nm=(document.getElementById('sigName')||{}).value||'';
  if(!nm.trim()){ toast('Enter the customer name'); return; }
  if(!__sig.dirty){ toast('Please sign in the box'); return; }
  let sig=''; try{ sig=cv.toDataURL('image/png'); }catch(e){}
  jb.approval={name:nm.trim(), sig, at:new Date().toLocaleString()};
  resetSig(); render(); window.scrollTo(0,0); toast('Approved — thank you!');
}
/* Save the signed scope as a PDF. Uses the browser's print sheet ("Save as PDF" / iOS
   Share → Save to Files) so the result is a real, text-selectable PDF with no add-ons.
   The document title is swapped first because browsers use it as the default filename. */
function savePdf(){
  const c=co();
  const safe=v=>String(v||'').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim();
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const stamp=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
  const signed=!!(jb.presented && jb.approval);
  const kind=signed?'Agreed Scope':'Options';
  const who=signed?safe(jb.approval.name):'';
  const prev=document.title;
  document.title=[safe(c.name),kind,who,stamp].filter(Boolean).join(' - ');
  let done=false;
  const restore=()=>{ if(done)return; done=true; document.title=prev; window.removeEventListener('afterprint',restore); };
  window.addEventListener('afterprint',restore);
  setTimeout(()=>{ try{ window.print(); }catch(e){ toast('Could not open the print sheet'); } setTimeout(restore,2000); },60);
}

function newJobGroup(){

function createJobGroup(){
  const c=co(); const label=(document.getElementById('ngLabel').value||'').trim();
  if(!label){ toast('Enter a group name'); return; }
  const cat=(document.getElementById('ngCat').value||'').trim()||'Custom';
  const synRaw=(document.getElementById('ngSyn').value||'').toLowerCase();

  if(exists){ toast('A group with that name already exists'); return; }
  const key=newId('grp');
  c.settings.groups[key]={label, cat, syn, custom:true};
  saveState(); closeModal(); render();
  toast('Group created');

function deleteJobGroup(k){

function saveGroupEdit(k){
  const c=co(); const label=(document.getElementById('egLabel').value||'').trim();
  if(!label){ toast('Enter a name'); return; }
  const dup=Object.entries(allGroups()).some(([kk,g])=>kk!==k && g.label.toLowerCase()===label.toLowerCase());
  if(dup){ toast('Another group already has that name'); return; }
  const cat=(document.getElementById('egCat').value||'').trim()||'Custom';
  if(isCustomGroup(k)){
    const synRaw=(document.getElementById('egSyn').value||'').toLowerCase();
    const syn=Array.from(new Set([label.toLowerCase(), ...synRaw.split(',').map(x=>x.trim()).filter(Boolean)]));
    c.settings.groups[k]=Object.assign({}, c.settings.groups[k], {label, cat, syn});
    if(c.settings.groupLabels) delete c.settings.groupLabels[k];   // custom label lives on the group itself
  } else {

    if(label===GROUPS[k].label) delete c.settings.groupLabels[k]; else c.settings.groupLabels[k]=label;

}

    <div style="display:flex;align-items:center;margin-bottom:6px"><div class="section-title" style="margin:0">Materials Markup — Sliding Scale</div>
      <label style="margin-left:auto;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px">Use sliding scale<input type="checkbox" ${s.useSliding?'checked':''} onchange="setS('useSliding',this.checked?'1':'0')"></label></div>
    <p class="mini" style="margin:0 0 12px">Pulled from your Housecall Pro settings — cheap parts marked up harder, big-ticket parts less. Applied to field-built tasks.</p>
    ${s.useSliding?`<table class="tbl"><thead><tr><th>Cost from</th><th>Cost to</th><th>Markup %</th><th>Sell multiple</th></tr></thead><tbody>
      ${s.markupTiers.map((t,i)=>{const from=i===0?0:s.markupTiers[i-1].to;return `<tr><td class="mono">${fmt2(from+ (i===0?0:0.01))}</td><td class="mono">${t.to==null?'—':fmt2(t.to)}</td><td><input type="number" value="${t.pct}" onchange="setMarkup(${i},this.value)" style="width:90px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px"><span style="color:var(--mute)">%</span></td><td class="mini mono">×${(1+t.pct/100).toFixed(2)}</td></tr>`;}).join('')}
    </tbody></table>`:`<div class="field" style="max-width:220px"><label>Flat markup on all materials</label><div class="inline-affix"><input type="number" value="${s.flatMarkup}" onchange="setS('flatMarkup',this.value)"><span class="suf">%</span></div></div>`}
  </div>

  <div class="card card-pad">
    <div class="section-title">Option Tiers &amp; Branding</div>
    <p class="mini" style="margin:-4px 0 12px">Names, taglines and colors the customer sees. Legally distinct from any competitor.</p>
    <div style="display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:10px;font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;padding-bottom:6px"><span>Color</span><span>Name</span><span>Tagline</span><span></span></div>
    ${c.tiers.map((t,i)=>`<div style="display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)">
      <input type="color" value="${t.color}" onchange="setTier(${i},'color',this.value)" style="width:34px;height:34px;padding:2px;border-radius:8px">
      <input value="${esc(t.name)}" onchange="setTier(${i},'name',this.value)" style="padding:9px 11px;border:1.5px solid var(--line);border-radius:9px">
      <input value="${esc(t.tag)}" onchange="setTier(${i},'tag',this.value)" style="padding:9px 11px;border:1.5px solid var(--line);border-radius:9px">
      <button class="ws-x" onclick="removeTier(${i})" ${c.tiers.length<=2?'disabled style=opacity:.3':''}>✕</button></div>`).join('')}
    <button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="addTier()">${ICO.plus} Add tier</button>
  </div>

  <div class="card card-pad" style="margin-top:22px">
    <div class="section-title">AI Assist <span style="color:var(--mute);font-weight:600;text-transform:none;letter-spacing:0">— optional</span></div>
    <p class="mini" style="margin:-4px 0 12px">Add your Anthropic API key to let the app read messy job notes and write customer descriptions. The key is stored only on this device and calls go straight to Anthropic. Everything works offline without it.</p>
    <div class="row2">
      <div class="field"><label>AI matching &amp; writing</label><select onchange="setAI('enabled',this.value)"><option value="0" ${!(DB.ai&&DB.ai.enabled)?'selected':''}>Off — use offline matching</option><option value="1" ${(DB.ai&&DB.ai.enabled)?'selected':''}>On</option></select></div>
      <div class="field"><label>Model</label><input value="${esc((DB.ai&&DB.ai.model)||'claude-haiku-4-5')}" onchange="setAI('model',this.value)"></div>
    </div>
    <div class="field"><label>Anthropic API key</label><input type="password" value="${esc((DB.ai&&DB.ai.key)||'')}" placeholder="sk-ant-..." onchange="setAI('key',this.value)"><div class="hint">Stored only on this device. Get one at console.anthropic.com.</div></div>
    <div style="display:flex;align-items:center;gap:12px"><button class="btn btn-ghost btn-sm" onclick="testAI()">Test connection</button><span id="aiStatus" class="mini"></span></div>
  </div>

  ${(ROLE==='master'||ROLE==='owner')?`<div class="card card-pad" style="margin-top:22px">
    <div class="section-title">Team</div>
    <p class="mini" style="margin:-4px 0 10px">Invite people to ${esc(co().name)} — they get an email to set their own password, then sign in with their personal login (no shared code).</p>
    <div class="row2">
      <div class="field"><label>Email</label><input id="tmEmail" type="email" placeholder="name@company.com"></div>
      ${ROLE==='master'?`<div class="field"><label>Role</label><select id="tmRole"><option value="tech">Tech — Job Builder &amp; Price Book</option><option value="owner">Owner — full shop admin</option></select></div>`:`<input type="hidden" id="tmRole" value="tech">`}
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><button class="btn btn-red btn-sm" onclick="inviteMember()">Send invite</button><span id="tmStatus" class="mini"></span></div>
  </div>`:''}
  <div class="card card-pad" style="margin-top:22px">
    <div class="section-title">Sync</div>
    <p class="mini" style="margin:-4px 0 8px">Your price book, rates &amp; tiers sync automatically to the cloud and to every device signed into your shop — edits save as you go.</p>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="syncNow()">Sync now (pull latest)</button><span id="syncStatus" class="mini"></span></div>
  </div>`;
}
async function inviteMember(){ const el=document.getElementById('tmEmail'); const email=(el?el.value:'').trim().toLowerCase(); const rEl=document.getElementById('tmRole'); const role=(rEl&&rEl.value)||'tech'; const st=document.getElementById('tmStatus');
  if(!email){ if(st)st.textContent='Enter an email'; return; }
  if(st)st.textContent='Sending…';
  try{ const {data:{session}}=await sb.auth.getSession(); const token=session&&session.access_token;
    const r=await fetch(SUPABASE_URL+'/functions/v1/admin',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+token,'apikey':SUPABASE_ANON},body:JSON.stringify({action:'invite_member',tenantId:co().id,email,role})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){ if(st)st.textContent='Invite sent to '+email+' ('+(d.role||role)+')'; el.value=''; toast('Invite sent'); }
    else { if(st)st.textContent='Error: '+(d.error||r.status); }
  }catch(e){ if(st)st.textContent='Error: '+e; }
}
function onLogoPick(input){ const f=input.files&&input.files[0]; if(!f){return;}
  if(f.size>6*1024*1024){ toast('Image too large (max 6MB)'); input.value=''; return; }
  const rd=new FileReader();
  rd.onload=e=>{ const src=e.target.result;
    if(f.type==='image/svg+xml'){ co().settings.logo=src; saveState(); render(); toast('Logo saved'); return; }
    const img=new Image();
    img.onload=()=>{ let w=img.width,h=img.height; if(!w||!h){ toast('Could not read image'); return; } const max=240, sc=Math.min(1,max/Math.max(w,h)); w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc)); const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d'); cx.clearRect(0,0,w,h); cx.drawImage(img,0,0,w,h); let data; try{ data=cv.toDataURL('image/png'); }catch(err){ toast('Image error'); return; } co().settings.logo=data; saveState(); render(); toast('Logo saved'); };
    img.onerror=()=>toast('Could not read that image');
    img.src=src;
  };
  rd.readAsDataURL(f);
}
function removeLogo(){ if(co().settings) delete co().settings.logo; saveState(); render(); toast('Logo removed'); }
function setS(k,v){ const s=co().settings;
  if(k==='showMonthly'||k==='useSliding'||k==='enforceOrder') s[k]=(v==='1'||v===true);
  else if(k==='numOptions'){ s.numOptions=parseInt(v); s.spread=linspace(0.3,0.92,s.numOptions); ensureTiers(co(),s.numOptions); }
  else if(['roundTo','financeMonths'].includes(k)) s[k]=parseInt(v)||1;
  else if(k==='featuredPos') s[k]=v;   // 'none' | 'middle' | option number (string)
  else if(k==='wisetackUrl') s[k]=(v||'').trim();
  else s[k]=parseFloat(v)||0;
  saveState(); jb.options=null; render(); toast('Saved');
}
function setMarkup(i,v){ co().settings.markupTiers[i].pct=parseFloat(v)||0; saveState(); toast('Markup updated'); }
function setTier(i,k,v){ co().tiers[i][k]=v; saveState(); if(k==='color')render(); jb.options=null; toast('Updated'); }
function addTier(){ const c=co(); c.tiers.push({key:newId('tr'),name:'New Tier',tag:'Describe it',color:'#7a869a'}); if(c.tiers.length>c.settings.numOptions){c.settings.numOptions=Math.min(4,c.tiers.length);c.settings.spread=linspace(0.35,0.9,c.settings.numOptions);} saveState(); render(); }
function removeTier(i){ const c=co(); if(c.tiers.length<=2){toast('Keep at least 2');return;} c.tiers.splice(i,1); if(c.settings.numOptions>c.tiers.length){c.settings.numOptions=c.tiers.length;c.settings.spread=linspace(0.35,0.9,c.settings.numOptions);} saveState(); render(); }

/* ================= VIEW: MASTER ================= */
function renderMaster(){
  return `<div class="page-head"><h2>Master Admin</h2><p>OptionPush — every shop on the platform. Your licensing layer.</p></div>
  <div class="stat-grid" style="margin-bottom:22px">
    <div class="stat"><div class="sv">${DB.companies.length}</div><div class="sl">Licensed companies</div></div>
    <div class="stat"><div class="sv">${DB.companies.reduce((a,c)=>a+c.book.length,0)}</div><div class="sl">Total tasks</div></div>
    <div class="stat"><div class="sv">${DB.companies.reduce((a,c)=>a+c.book.filter(t=>t.custom).length,0)}</div><div class="sl">Field-built tasks</div></div>
  </div>
  <div class="card card-pad">
    <div style="display:flex;align-items:center;margin-bottom:14px"><div class="section-title" style="margin:0">Shops</div><a class="btn btn-ghost btn-sm" style="margin-left:auto;text-decoration:none" href="admin.html" target="_blank">Manage in Admin Console ↗</a></div>
    <table class="tbl"><thead><tr><th>Company</th><th>Labor</th><th>Markup</th><th>Tasks</th><th></th></tr></thead><tbody>
    ${DB.companies.map(c=>`<tr><td><b>${esc(c.name)}</b>${c.id===DB.activeCompanyId?' <span class="pillcat" style="background:#e6f4ec;color:#2e7d5b">ACTIVE</span>':''}</td><td class="mono">${fmt(c.settings.laborRate)}</td><td class="mono">${c.settings.useSliding?'Sliding':c.settings.flatMarkup+'%'}</td><td>${c.book.length}</td><td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="switchCompany('${c.id}')">Open</button></td></tr>`).join('')}
    </tbody></table>
    <p class="mini" style="margin-top:14px">Each shop is isolated — own rates, markup, tiers, and book. Add, invite, or suspend shops in the OptionPush Admin Console.</p>
  </div>`;
}
function switchCompany(id){ DB.activeCompanyId=id; saveState(); TAB='jobbuilder'; newJob(); toast('Now on '+co().name); }
function addCompany(){ openModal('Add licensed company', `<div class="field"><label>Company name</label><input id="ncName" placeholder="e.g. Peachtree Plumbing"></div><div class="field"><label>Start from</label><select id="ncClone"><option value="tgp">Clone True Grit's book (recommended)</option><option value="blank">Blank book</option></select></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-ghost btn-block" onclick="closeModal()">Cancel</button><button class="btn btn-red btn-block" onclick="doAddCompany()">Create</button></div>`); }
function doAddCompany(){ const name=document.getElementById('ncName').value.trim(); if(!name){toast('Enter a name');return;} const clone=document.getElementById('ncClone').value; const base=clone==='blank'?null:(DB.companies.find(c=>c.id==='tgp')||DB.companies[0]); const nc=newCompany(newId('co'),name); if(base){nc.settings=JSON.parse(JSON.stringify(base.settings));nc.tiers=JSON.parse(JSON.stringify(base.tiers));nc.book=JSON.parse(JSON.stringify(base.book));} else {nc.book=[];} DB.companies.push(nc); DB.activeCompanyId=nc.id; saveState(); closeModal(); TAB='jobbuilder'; newJob(); toast('Company created'); }
function deleteCompany(id){ if(DB.companies.length<=1){toast('Keep at least one');return;} openModal('Remove company?', `<p style="color:var(--mute);margin:0 0 16px">Deletes the company and its book.</p><div style="display:flex;gap:10px"><button class="btn btn-ghost btn-block" onclick="closeModal()">Cancel</button><button class="btn btn-red btn-block" onclick="doDelCompany('${id}')">Delete</button></div>`); }
function doDelCompany(id){ DB.companies=DB.companies.filter(c=>c.id!==id); if(DB.activeCompanyId===id)DB.activeCompanyId=DB.companies[0].id; saveState(); sbDelete(id); closeModal(); render(); }

window.addEventListener('load',()=>{ boot(); const g=document.getElementById('gateEmail'); if(g)g.focus(); });
</script>
</body>
