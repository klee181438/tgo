name: Keep Supabase awake
on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase to register activity
        run: |
          URL="https://wctpjtfvdhfejrkiiwdw.supabase.co"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjdHBqdGZ2ZGhmZWpya2lpd2R3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyODMwNTYsImV4cCI6MjEwMDg1OTA1Nn0.2zGJnixNVu7bRs4Ryb28M4Ntbdt_dBJ_oHOt7gPSoAg"
          echo -n "REST "; curl -sS --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors -o /dev/null -w "%{http_code}\n" "$URL/rest/v1/tenants?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo -n "AUTH "; curl -sS --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors -o /dev/null -w "%{http_code}\n" "$URL/auth/v1/health"
